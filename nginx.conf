
worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

load_module modules/ngx_otel_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # OpenTelemetry Exporter
    otel_exporter {
        endpoint otel-collector:4317;
        interval 1s;
    }

    otel_service_name nginx-test;
    otel_service_version 1.0.0;

    # Enable tracing
    otel_trace on;
    otel_trace_context propagate;

    # Custom attributes
    otel_resource_attr deployment.environment test;
    otel_resource_attr service.version 1.0.0;

    otel_span_attr test nginx-otel-test;

    # JSON access log
    log_format otel_json escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"trace_id":"$otel_trace_id",'
        '"span_id":"$otel_span_id",'
        '"parent_id":"$otel_parent_id",'
        '"parent_sampled":"$otel_parent_sampled",'
        '"incoming_traceparent":"$http_traceparent"'
    '}';

    access_log /dev/stdout otel_json;

    server {
        listen 80;
        server_name _;

        # Simple test endpoint
        location = / {
            return 200 "NGINX OpenTelemetry Test";
        }

        # .NET API
        location /api/ {
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_pass http://dotnet-api:8080;
        }
    }
}
